[project]
name = "agentic-workflow"
version = "0.1.0"
description = "LangGraph-based agentic workflow orchestration system"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "icontract>=2.7",
    "pydantic>=2.0",
    "python-sonarqube-api>=2.0.5",
    "python-dotenv>=1.0.0",
    "z3-solver>=4.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-bdd>=8.0",
    "pytest-cov>=6.0",
    "crosshair-tool>=0.0.82",
    "ruff>=0.11",
    "mypy>=1.15",
    "pdoc>=14.0.0",
    "mkdocs>=1.5.3",
    "bandit>=1.7.8",
    "safety>=3.1.0",
    "pip-audit>=2.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"
addopts = "--cov=src/agentic_workflow --cov-branch --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/pytest.xml"
filterwarnings = [
    # Default: every unhandled warning becomes a hard test error.
    "error"
]

[tool.coverage.run]
branch = true
source = ["src/agentic_workflow"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_workflow"]
