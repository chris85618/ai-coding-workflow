name: Build
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
env:
  PYTHON_VERSION: "3.12"
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run validation and linting
        run: |
          python -m ruff check src tests
          python -m mypy src tests --ignore-missing-imports --explicit-package-bases
      - name: Run tests with coverage
        run: |
          python -m pytest --cov --cov-branch --cov-report=xml:reports/coverage.xml --junitxml=reports/pytest.xml
      - name: Determine SonarQube Version
        if: success() || failure()
        id: vars
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "SONAR_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "SONAR_VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi
      - name: SonarQube Scan
        if: success() || failure()
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION_KEY }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.projectVersion=${{ env.SONAR_VERSION }}
            -Dsonar.python.version=${{ env.PYTHON_VERSION }}
