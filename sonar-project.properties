# SonarCloud Configuration File
# ----------------------------------------------------------------------------
# Path Configuration
# ----------------------------------------------------------------------------

# Path to the source directories (comma-separated)
sonar.sources=src

# Path to the test directories (comma-separated)
sonar.tests=tests

# Exclusions from analysis
sonar.exclusions=tests/**, docs/**, **/setup.py, venv/**, .venv/**

# ----------------------------------------------------------------------------
# Language Specific Configuration (Python)
# ----------------------------------------------------------------------------

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Path to xUnit style unit test report
sonar.python.xunit.reportPath=reports/pytest.xml

# Path to coverage report (SonarQube supports XML format generated by coverage.py)
sonar.python.coverage.reportPaths=reports/coverage.xml

# ----------------------------------------------------------------------------
# Additional Metadata
# ----------------------------------------------------------------------------
# sonar.host.url=https://sonarcloud.io
